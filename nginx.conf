server {
    listen 80;
    server_name your-domain.com;

    # Frontend
    location /flowcraft/ {
        alias /root/nginx-docker/www/flowcraft/;
        try_files $uri $uri/ /flowcraft/index.html;
    }

    # API proxy — host.docker.internal 指向宿主机
    location /flowcraft/api/ {
        rewrite ^/flowcraft/api/(.*)$ /api/$1 break;
        proxy_pass http://host.docker.internal:3800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        client_max_body_size 100m;
    }

    # Static assets long cache
    location /flowcraft/assets/ {
        alias /root/nginx-docker/www/flowcraft/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
