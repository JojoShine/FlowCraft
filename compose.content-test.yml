name: flowcraft-content-test
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: flowcraft_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: flowcraft_test
    ports: ["127.0.0.1:55439:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowcraft_test -d flowcraft_test"]
      interval: 2s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: flowcraft-test
      MINIO_ROOT_PASSWORD: local-test-only-secret
    ports: ["127.0.0.1:19000:9000"]
    tmpfs: [/data]
