services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    init: true
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      NODE_ENV: production
      PORT: "8080"
      BASE_PATH: ${BASE_PATH:?BASE_PATH is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["127.0.0.1:${APP_PORT:?APP_PORT is required}:8080"]
    healthcheck:
      test: [CMD, /app/bin/healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    profiles: [ops]
    restart: "no"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    command: [/app/bin/migrate]
  bootstrap:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    profiles: [ops]
    restart: "no"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-}
    command: [/app/bin/bootstrap]
